; Install to /etc/supervisor/conf.d/diceroller.conf, then:
;   supervisorctl reread && supervisorctl update
; Check it came up with: supervisorctl status diceroller
;
; Gunicorn binds 127.0.0.1:8080 because that is where the provided nginx site
; proxies to; nginx itself is what listens on 8000 outside the container.

[program:diceroller]
directory=/srv/diceroller
command=/srv/diceroller/venv/bin/gunicorn
    --bind 127.0.0.1:8080
    --workers 2
    --timeout 60
    --access-logfile -
    flask_app:app

autostart=true
autorestart=true
startsecs=5
startretries=3

; Give gunicorn time to finish an in-flight sweep before it is killed
stopsignal=TERM
stopwaitsecs=30

; Drop this line if supervisord does not run as root in the image
user=www-data

; Unbuffered, so logs appear immediately rather than when a buffer fills
environment=PYTHONUNBUFFERED="1"

; Route the app's logs to the container's stdout/stderr so `docker logs` sees
; them. maxbytes=0 disables supervisor's rotation, which is required for /dev/*.
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
