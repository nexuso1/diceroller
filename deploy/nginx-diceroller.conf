# Install to /etc/nginx/sites-available/diceroller and symlink into sites-enabled:
#   sudo ln -s /etc/nginx/sites-available/diceroller /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# Then run certbot --nginx -d your.domain, which rewrites this file for TLS.

server {
    listen 80;
    server_name your.domain;

    # Serve static assets directly; the Nunito fonts alone are ~1.5 MB and
    # there is no reason for a gunicorn worker to spend time on them.
    location /static/ {
        alias /opt/diceroller/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A full sweep can legitimately take tens of seconds; keep this above the
        # app's SWEEP_BUDGET_SECONDS and below the gunicorn --timeout.
        proxy_read_timeout 60s;

        # Requests are small JSON payloads; nothing here needs uploads.
        client_max_body_size 64k;
    }
}
