# The stock site config with two changes: the static alias points at the repo,
# and the proxy gets a read timeout and a body cap.
# Install over the provided default (often /etc/nginx/conf.d/default.conf), then:
#   nginx -t && nginx -s reload

server {
        listen       0.0.0.0:8000;
        listen       [::]:8000;

        location / {
                proxy_pass         http://127.0.0.1:8080/;
                proxy_redirect     default;
                proxy_set_header   X-Real-IP  $remote_addr;
                proxy_set_header   Host       $host;

                # A full sweep can legitimately take tens of seconds. Keep this
                # above the app's SWEEP_BUDGET_SECONDS and below gunicorn's
                # --timeout, so the app returns its own error message first.
                proxy_read_timeout 60s;

                # Requests are small JSON payloads; nothing here is uploaded.
                client_max_body_size 64k;
        }

        # Served by nginx directly, so no gunicorn worker spends time on the
        # ~1.5 MB of Nunito fonts.
        location /static/ {
                alias /srv/diceroller/static/;
                expires 30d;
                access_log off;
        }
}
