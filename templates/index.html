<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Roll Statistic Calculator</title>
    <!-- Include Chart.js from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel=stylesheet href="{{ url_for('static', filename='style.css') }}"></link>
</head>
<body>

<div class="container">
    <h1>Dice Roll Expected Value Calculator</h1>
    
    <!-- Input Section -->
    <form id="calc-form">
        <div class="input-group">
            <div class="input-wrapper">
                <label for="expression">Input dice expression:</label>
                <div class="input-with-history">
                    <input type="text" id="expression" placeholder="Type an expression, e.g (d20 + 6 >= 15) * (2d6 + 5)" value="(d20 + 6 >= 15) * (2d6 + 5)" required>
                    <button type="button" id="history-toggle" class="history-toggle" aria-expanded="false" aria-controls="history-panel" title="Previous simulations">
                        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="6 9 12 15 18 9"></polyline>
                        </svg>
                    </button>
                    <div id="history-panel" class="history-panel">
                        <!-- Saved simulations render here -->
                    </div>
                </div>
            </div>
            <div style="display: flex; align-items: flex-end;">
                <button type="submit" id="submit-btn" class="primary-btn">Simulate <span class="key-badge">S</span></button>
            </div>
        </div>
    </form>

    <!-- Variables (Optional) -->
    <div class="variables-section">
        <div class="variables-header">
            <button type="button" id="add-var-btn" class="secondary-btn">Add Variable</button>
            <span id="var-count-lbl" style="color: #64748b; font-size: 0.95rem;">Current number of variables: 0/3</span>
        </div>
        <div id="variables-list" class="variables-list">
            <!-- Dynamic variables will insert here -->
        </div>
    </div>

    <!-- Error Message Banner -->
    <div id="error-message" class="error"></div>

    <!-- Output Dashboard -->
    <div id="dashboard" class="result-section">
        <div id="main-result-view"></div>

        <!-- Comparison against a recorded simulation (hidden when nothing is recorded) -->
        <div id="comparison-area" class="comparison-area">
            <!-- Same layout as the expression row: stretching picker, button on the right.
                 The picker only appears while the comparison is shown. -->
            <div class="input-group">
                <div class="control-item comparison-picker">
                    <label for="comparison-input">Recorded simulation</label>
                    <!-- Same read-only field + chevron pattern as the expression history -->
                    <div class="input-with-history">
                        <input type="text" id="comparison-input" class="picker-input" readonly aria-haspopup="listbox" placeholder="No simulation selected">
                        <button type="button" id="comparison-picker-toggle" class="history-toggle" aria-expanded="false" aria-controls="comparison-options" title="Recorded simulations">
                            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <polyline points="6 9 12 15 18 9"></polyline>
                            </svg>
                        </button>
                        <div id="comparison-options" class="history-panel"></div>
                    </div>
                </div>
                <div class="comparison-action">
                    <button type="button" id="compare-btn" class="secondary-btn compare-btn" aria-expanded="false" aria-controls="comparison-panel">Compare results</button>
                </div>
            </div>

            <div id="comparison-panel" class="comparison-panel">
                <div id="comparison-view"></div>
            </div>
        </div>
    </div>

    <!-- Usage Guide -->
    <div class="usage-guide">
        {{ guide_html|safe }}
    </div>

    <!-- Single markup source for every result display; cloned once per view -->
    <template id="result-view-template">
        <div class="result-view">
            <div class="results-header">
                <h2 class="result-title"></h2>

                <!-- Multi-variable view controls (only shown in sweep mode) -->
                <div class="view-controls control-row">
                    <div class="control-item">
                        <label>View</label>
                        <select class="view-mode">
                            <option value="list">List</option>
                            <option value="matrix">Matrix</option>
                        </select>
                    </div>
                    <div class="control-item matrix-only">
                        <label>Rows</label>
                        <select class="matrix-row-var"></select>
                    </div>
                    <div class="control-item matrix-only">
                        <label>Columns</label>
                        <select class="matrix-col-var"></select>
                    </div>
                    <div class="control-item matrix-only">
                        <label>Metric</label>
                        <select class="matrix-metric">
                            <option value="mean">Mean</option>
                            <option value="median">Median</option>
                            <option value="std">Standard deviation</option>
                        </select>
                    </div>
                    <!-- Dropdowns to fix the value of any variable not on an axis -->
                    <div class="matrix-only slice-controls control-row"></div>
                </div>
            </div>

            <div class="result-grid dashboard-grid">
                <!-- Summary Table Section -->
                <div class="table-container">
                    <table class="summary-table">
                        <!-- Head and body will render dynamically depending on mode -->
                    </table>
                </div>

                <!-- Chart Section (Only visible/active in single mode) -->
                <div class="chart-section-wrapper">
                    <div class="chart-container">
                        <canvas></canvas>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <div class=""
</div>

<script type=text/javascript src="{{
  url_for('static', filename='script.js')
}}"></script>

</body>
</html>
